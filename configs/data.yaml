# Data preparation (docs/DESIGN.md D2). Source: UCI id 296, CC BY 4.0, DOI 10.24432/C5230J.
raw_url: https://archive.ics.uci.edu/static/public/296/diabetes+130-us+hospitals+for+years+1999-2008.zip
raw_csv: data/raw/diabetic_data.csv   # downloaded + unzipped from raw_url if missing
processed_dir: data/processed

target_column: readmitted
target_positive: "<30"

# Expired / hospice discharges, checked against IDS_mapping.csv: patient cannot be readmitted.
drop_discharge_ids: [11, 13, 14, 19, 20, 21]

# Dropped features: too much missingness (weight 97%, payer_code 40%, medical_specialty 49%).
drop_columns: [weight, payer_code, medical_specialty]

numeric: [time_in_hospital, num_lab_procedures, num_procedures, num_medications,
          number_outpatient, number_emergency, number_inpatient, number_diagnoses]

categorical: [race, gender, age, admission_type_id, discharge_disposition_id, admission_source_id,
              diag_1, diag_2, diag_3, max_glu_serum, A1Cresult, change, diabetesMed]

# Diabetes medications used in >= 1% of first encounters; rarer/constant ones are dropped [Assumption].
medications: [metformin, repaglinide, glimepiride, glipizide, glyburide, pioglitazone, rosiglitazone, insulin]

onehot_min_frequency: 50   # categories rarer than this in train are folded into "infrequent"

split:
  test_size: 0.2
  seed: 42
